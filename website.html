<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Stream Search</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            font-family: Arial, sans-serif;

            background: #111827;
            color: white;

            display: flex;
            justify-content: center;
            align-items: flex-start;

            padding-top: 100px;
        }

        .container {
            width: 100%;
            max-width: 650px;
            padding: 20px;
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
        }

        .search-box {
            position: relative;
        }

        #search {
            width: 100%;
            padding: 16px 18px;

            font-size: 18px;

            color: white;
            background: #1f2937;

            border: 2px solid #374151;
            border-radius: 10px;

            outline: none;
        }

        #search:focus {
            border-color: #6366f1;
        }

        #results {
            position: absolute;

            width: 100%;

            margin-top: 5px;

            background: #1f2937;

            border-radius: 10px;

            overflow: hidden;

            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);

            z-index: 100;
        }

        .result {
            padding: 14px 18px;

            cursor: pointer;

            border-bottom: 1px solid #374151;

            transition: background 0.15s;
        }

        .result:last-child {
            border-bottom: none;
        }

        .result:hover,
        .result.selected {
            background: #374151;
        }

        .username {
            font-size: 16px;
            font-weight: bold;
        }

        .no-results {
            padding: 15px;
            color: #9ca3af;
        }

        #streamBox {
            display: none;

            margin-top: 25px;

            padding: 20px;

            background: #1f2937;

            border-radius: 10px;
        }

        #selectedUsername {
            margin-top: 0;
            color: #a5b4fc;
        }

        .url {
            background: #111827;

            padding: 12px;

            border-radius: 8px;

            word-break: break-all;

            color: #d1d5db;

            margin-bottom: 12px;
        }

        button {
            border: none;

            padding: 11px 16px;

            border-radius: 8px;

            cursor: pointer;

            background: #6366f1;

            color: white;

            font-size: 15px;
        }

        button:hover {
            background: #4f46e5;
        }

        #status {
            text-align: center;

            color: #9ca3af;

            margin-top: 15px;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Stream Search</h1>

    <div class="search-box">

        <input
            type="text"
            id="search"
            placeholder="Search username..."
            autocomplete="off"
        >

        <div id="results"></div>

    </div>

    <div id="status">
        Loading streams...
    </div>

    <div id="streamBox">

        <h2 id="selectedUsername"></h2>

        <div class="url" id="streamUrl"></div>

        <button id="copyButton">
            Copy Link
        </button>

        <button id="openButton">
            Open Link
        </button>

    </div>

</div>


<script>

    let streams = {};

    let usernames = [];

    let selectedIndex = -1;


    const searchInput = document.getElementById("search");
    const resultsBox = document.getElementById("results");

    const streamBox = document.getElementById("streamBox");
    const selectedUsername = document.getElementById("selectedUsername");
    const streamUrl = document.getElementById("streamUrl");

    const copyButton = document.getElementById("copyButton");
    const openButton = document.getElementById("openButton");

    const status = document.getElementById("status");


    // Load streams.json
    fetch("streams.json")
        .then(response => {

            if (!response.ok) {
                throw new Error("Could not load streams.json");
            }

            return response.json();

        })
        .then(data => {

            streams = data;

            usernames = Object.keys(streams);

            status.textContent =
                `${usernames.length} streams loaded`;

        })
        .catch(error => {

            console.error(error);

            status.textContent =
                "Could not load streams.json";

        });


    // Search
    searchInput.addEventListener("input", function () {

        const query = this.value
            .trim()
            .toLowerCase();

        selectedIndex = -1;

        streamBox.style.display = "none";

        resultsBox.innerHTML = "";

        if (!query) {
            return;
        }


        const matches = usernames.filter(username =>
            username.toLowerCase().startsWith(query)
        );


        if (matches.length === 0) {

            resultsBox.innerHTML = `
                <div class="no-results">
                    No usernames found
                </div>
            `;

            return;
        }


        // Show maximum 20 results
        matches.slice(0, 20).forEach((username, index) => {

            const div = document.createElement("div");

            div.className = "result";

            div.textContent = username;

            div.dataset.username = username;


            div.addEventListener("click", function () {

                selectUsername(username);

            });


            resultsBox.appendChild(div);

        });

    });


    // Keyboard navigation
    searchInput.addEventListener("keydown", function (event) {

        const results = resultsBox.querySelectorAll(".result");

        if (results.length === 0) {
            return;
        }


        if (event.key === "ArrowDown") {

            event.preventDefault();

            selectedIndex++;

            if (selectedIndex >= results.length) {
                selectedIndex = 0;
            }

            updateSelected(results);

        }


        else if (event.key === "ArrowUp") {

            event.preventDefault();

            selectedIndex--;

            if (selectedIndex < 0) {
                selectedIndex = results.length - 1;
            }

            updateSelected(results);

        }


        else if (event.key === "Enter") {

            event.preventDefault();

            if (selectedIndex >= 0) {

                const username =
                    results[selectedIndex].dataset.username;

                selectUsername(username);

            }
            else {

                selectUsername(results[0].dataset.username);

            }

        }


        else if (event.key === "Escape") {

            resultsBox.innerHTML = "";

        }

    });


    function updateSelected(results) {

        results.forEach((item, index) => {

            item.classList.toggle(
                "selected",
                index === selectedIndex
            );

        });

    }


    function selectUsername(username) {

        const url = streams[username];

        if (!url) {
            return;
        }


        searchInput.value = username;

        resultsBox.innerHTML = "";


        selectedUsername.textContent = username;

        streamUrl.textContent = url;

        streamBox.style.display = "block";


        // Store currently selected URL
        streamUrl.dataset.url = url;

    }


    // Copy link
    copyButton.addEventListener("click", async function () {

        const url = streamUrl.dataset.url;

        if (!url) {
            return;
        }


        try {

            await navigator.clipboard.writeText(url);

            copyButton.textContent = "Copied!";

            setTimeout(() => {

                copyButton.textContent = "Copy Link";

            }, 1500);

        }
        catch (error) {

            console.error(error);

            alert("Could not copy link.");

        }

    });


    // Open link
    openButton.addEventListener("click", function () {

        const url = streamUrl.dataset.url;

        if (!url) {
            return;
        }

        window.open(url, "_blank");

    });


    // Close results when clicking elsewhere
    document.addEventListener("click", function (event) {

        if (!event.target.closest(".search-box")) {

            resultsBox.innerHTML = "";

        }

    });

</script>

</body>
</html>
